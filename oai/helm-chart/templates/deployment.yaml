apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oai.fullname" . }}
  labels:
    {{- include "oai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Surge first, never drop below the desired count: the replacement pod must be
  # Ready before the outgoing one is signalled, so an upgrade has no gap where
  # the Service has zero endpoints. This is why the Deployment is a plain
  # resource and not a Helm hook — a hook with `before-hook-creation` deletes the
  # Deployment (and its pod) on every upgrade, which no rollout strategy can
  # soften. Ordering against garage-init is handled by the wait-garage-creds init
  # container plus the non-optional secret volume, which the kubelet retries
  # until the secret exists.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "oai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oai.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "oai.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- if .Values.garage.enabled }}
      initContainers:
        - name: wait-garage-creds
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while [ "$i" -lt 360 ]; do
                if [ -s /etc/oai-garage/garage-access-key-id ]; then
                  echo "garage credentials present"
                  exit 0
                fi
                i=$((i+1))
                echo "waiting for garage-init job to populate credentials ($i/360)..."
                sleep 5
              done
              echo "timeout waiting for garage credentials secret"
              exit 1
          volumeMounts:
            - name: garage-creds
              mountPath: /etc/oai-garage
              readOnly: true
      {{- end }}
      containers:
        - name: oai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0:3000"
            - name: STATIC_DIR
              value: {{ .Values.config.staticDir | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            # glibc gives each contending thread its own 64 MB malloc arena and
            # never returns them to the OS, so a burst of large image buffers
            # permanently raises RSS. Capping the arena count bounds that floor.
            - name: MALLOC_ARENA_MAX
              value: {{ .Values.config.mallocArenaMax | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "oai.fullname" . }}-secret
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "oai.fullname" . }}-secret
                  key: jwt-secret
            {{- if .Values.serviceAccount.create }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_POD_NAME
              value: {{ printf "%s-0" (include "oai.postgresHost" .) | quote }}
            {{- end }}
            {{- if .Values.garage.enabled }}
            - name: GARAGE_POD_NAME
              value: {{ printf "%s-0" (include "oai.garageSvcName" .) | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.garage.enabled }}
            - name: STORAGE_BACKEND
              value: "s3"
            - name: STORAGE_S3_BUCKET
              value: {{ .Values.garage.storage.bucket | quote }}
            - name: STORAGE_S3_REGION
              value: {{ .Values.garage.storage.region | quote }}
            - name: STORAGE_S3_ENDPOINT
              value: {{ printf "http://%s:%d" (include "oai.garageSvcName" .) (.Values.garage.service.s3Port | int) | quote }}
            - name: STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "oai.fullname" . }}-garage-creds
                  key: garage-access-key-id
            - name: STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "oai.fullname" . }}-garage-creds
                  key: garage-secret-access-key
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          # Endpoint removal and SIGTERM race each other; without this pause the
          # proxy can still route to a pod that has already begun shutting down.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopDrainSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.garage.enabled }}
      volumes:
        - name: garage-creds
          secret:
            secretName: {{ include "oai.fullname" . }}-garage-creds
      {{- end }}
