[package]
name = "offloadmq-cli"
version = "0.1.0"
edition = "2024"
description = "Standalone command-line client for the OffloadMQ management API"

[[bin]]
name = "omqcli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
